version: "3.7"
services:
    prmi-app:
        build:
            args:
                user: samdev
                uid: 1000
            context: ./
            dockerfile: Dockerfile
        image: prmi
        container_name: prmi-app
        restart: unless-stopped
        working_dir: /var/www/
        volumes:
            - ./:/var/www
        networks:
            - msa-networks

    prmi-nginx:
        image: nginx:alpine
        container_name: prmi-nginx
        restart: unless-stopped
        ports:
            - 8090:80
        volumes:
            - ./:/var/www
            - ./docker/nginx:/etc/nginx/conf.d/
        networks:
            - msa-networks

networks:
    msa-networks:
        driver: bridge
        name: msa-networks
        external: true
